<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Site Freelancer</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <img src="icons/icon48.png" alt="" class="topbar-logo">
    <span class="topbar-title">Site Freelancer</span>
    <button id="settings-btn" class="icon-btn" title="Configurações" aria-label="Configurações">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 8.6 19.4a1.65 1.65 0 0 0-1-.6 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1.1-.4H2.8a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.6a1.65 1.65 0 0 0 .6-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.64 2.89l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 0 .4-1.1V2.8a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15.4 4.6a1.65 1.65 0 0 0 1 .6 1.65 1.65 0 0 0 1.82-.33l.06-.06A2 2 0 0 1 21.11 7.64l-.06.06A1.65 1.65 0 0 0 19.4 9c.25.28.4.66.4 1.1v.09a2 2 0 1 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15Z"></path>
      </svg>
    </button>
  </header>

  <main id="view-login" class="view">
    <p class="hint">Inicie sessão para aceder rapidamente ao seu painel.</p>
    <form id="login-form">
      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="username">

      <label for="password">Palavra-passe</label>
      <input id="password" type="password" required autocomplete="current-password">

      <p id="login-error" class="error" hidden></p>

      <button type="submit" id="login-submit" class="btn-primary">Entrar</button>
    </form>
  </main>

  <main id="view-main" class="view" hidden>
    <div class="user-row">
      <div class="user-avatar" id="user-initial"></div>
      <div>
        <div class="user-name" id="user-name"></div>
        <div class="user-role" id="user-role"></div>
      </div>
    </div>

    <div class="badges-row">
      <div class="badge-tile">
        <span class="badge-count" id="chat-count">0</span>
        <span class="badge-label">Mensagens</span>
      </div>
      <div class="badge-tile">
        <span class="badge-count" id="notif-count">0</span>
        <span class="badge-label">Notificações</span>
      </div>
    </div>

    <nav class="quick-links" id="quick-links"></nav>

    <button id="logout-btn" class="btn-outline">Terminar sessão</button>
  </main>

  <script src="popup.js"></script>
</body>
</html>
